# Path rules. Patterns are matched case-insensitively against the path relative to
# the source root, split on "/". A pattern matches a path (and everything under it)
# when its segments match the path's leading segments. "*" matches within one
# segment; a "**" segment matches any number of segments. A trailing "/" marks a
# directory and is optional. "os" selects which kind of source the rule applies to
# ("windows", "linux" or "any"); a Windows data drive with a top-level "Dev" folder
# must not be hit by Linux system rules.

[[exclusion]]
scope = "Windows system"
os = "windows"
patterns = ["Windows/", "Program Files/", "Program Files (x86)/", "ProgramData/", "Recovery/", "MSOCache/", "Config.Msi/", "Intel/", "Drivers/", "$WINDOWS.~BT/", "Windows.old/Windows/"]
non_examples = ["Windows.old/Users/u1/Documents/report.docx"]
notes = "Windows.old/Users/ is still scanned"

[[exclusion]]
scope = "Windows per-user"
os = "windows"
patterns = ["Users/*/AppData/", "Documents and Settings/*/Application Data/", "Documents and Settings/*/Local Settings/", "**/AppData/Local/", "**/AppData/LocalLow/", "**/AppData/Roaming/"]
non_examples = ["Users/u1/Documents/report.docx", "Users/u1/Documents/AppData/report.docx"]
notes = "XP-era paths included; the ** forms catch profiles copied into backup folders (laptop_backup/joe/AppData/Local/...)"

[[exclusion]]
scope = "Windows housekeeping"
os = "windows"
patterns = ["$Recycle.Bin/", "RECYCLER/", "RECYCLED/", "System Volume Information/", "pagefile.sys", "hiberfil.sys", "swapfile.sys"]
non_examples = ["Users/u1/Documents/recycler notes.docx"]
notes = "Excluded by decision"

[[exclusion]]
scope = "Linux system"
os = "linux"
patterns = ["bin/", "boot/", "dev/", "etc/", "lib*/", "opt/", "proc/", "run/", "sbin/", "snap/", "sys/", "tmp/", "usr/", "var/", "**/lost+found/", "root/", "media/", "mnt/"]
non_examples = ["home/u1/Documents/report.docx", "home/u1/media/clip.docx"]
notes = "root/ is the administrator's home; media/ and mnt/ are mount points, empty when the disk is offline"

[[exclusion]]
scope = "Linux per-user"
os = "linux"
patterns = ["home/*/.cache/", "home/*/.config/", "home/*/.local/share/Trash/", "home/*/.mozilla/", "home/*/.thunderbird/", "home/*/.wine/", "home/*/.steam/", "home/*/.npm/", "home/*/.cargo/", "home/*/.rustup/"]
non_examples = ["home/u1/Documents/report.docx"]
notes = ".thunderbird holds mail; flip if email is in scope"

[[exclusion]]
scope = "Anywhere"
os = "any"
patterns = ["**/node_modules/", "**/__pycache__/", "**/.venv/", "**/venv/", "**/.git/", "**/steamapps/", "**/.Trash-*/", "**/.Spotlight-V100/", "**/.fseventsd/", "**/.vscode/extensions/", "**/.ssh/", "**/.tmp.driveupload/", "**/*.app/"]
non_examples = ["Documents/report.docx"]

[[exclusion]]
scope = "Applications installed in user folders"
os = "windows"
patterns = ["**/Ubiquiti UniFi/", "**/vlc-*-win32/", "**/vlc-*-win64/", "**/ACROBAT4/", "**/ACRO4WIN/", "**/ACR4UNIX/", "**/Acrobat Reader 4.0/", "**/Reader Installer/"]
non_examples = ["Users/u1/Documents/unifi setup notes.docx", "Users/u1/Books/Infectious diseases/READER/Icon.docx"]
notes = "UniFi controller; portable VLC; Acrobat Reader 4 bundled on book CD-ROMs (the book PDFs sit outside these folders)"

[[exclusion]]
scope = "Not wanted"
os = "any"
patterns = ["**/toniebox_sd_card/", "**/tools/scapy/"]
non_examples = ["Users/u1/Music/toniebox playlist.docx", "Users/u1/Documents/scapy notes.docx"]
notes = "Temporary copy of a Toniebox SD card, no longer needed; a downloaded Scapy checkout"

[[exclusion]]
scope = "Applications installed at the drive root"
os = "windows"
patterns = ["Xilinx/", ".Xilinx/", "OrCAD/", "Cadence/", "xampp/", "Riot Games/", "Python2*/", "Python3*/", "crystalreportviewers*/", "TEMP/", "Apps/", "dell/", "usb_driver/", "$AVG/", "AC_SWM/", "CW Decoder/", "tools_v4.8/", "adb/", "Windows 7 Pro x64 SP1 & Activator/", "intelFPGA*/", "altera*/", "ti/", "Keil*/", "MentorGraphics/", "Modeltech*/", "MinGW/", "msys64/", "cygwin*/"]
non_examples = ["Users/u1/Documents/Xilinx/report.docx", "Backup/Apps/report.docx"]
notes = "Tools, games and installers people put next to Program Files; only at the drive root"

[[exclusion]]
scope = "Engineering tool installations, installers and their bundled samples, at any depth"
os = "any"
patterns = [
  "**/ISE_DS/", "**/Xilinx/Vivado/", "**/Xilinx/Vitis/", "**/Xilinx/SDK/", "**/Xilinx/DocNav/", "**/Xilinx/Vivado_HLS/", "**/Xilinx_ISE_DS_*/", "**/Xilinx_Vivado_*/", "**/Xilinx_Unified_*/",
  "**/OrCAD_*_Demo/", "**/OrCAD/OrCAD_*/", "**/Cadence/SPB_*/", "**/Cadence/OrCAD_*/", "**/Cadence/PSpice*/",
  "**/altera/*/quartus/", "**/intelFPGA*/*/quartus/", "**/modelsim_ase/",
  "**/Microchip/MPLABX/", "**/Microchip/xc8/", "**/Microchip/xc16/", "**/Microchip/xc32/", "**/Microchip/MPLAB C32 Suite/",
  "**/ti/ccsv*/", "**/ti/ccs*/", "**/WinAVR-*/", "**/arduino-*-windows/", "**/arduino-1.*/",
  "**/MATLAB/R20*/", "**/Mathworks.Matlab.*/", "**/LTspiceXVII/examples/", "**/LTspice/examples/",
  "**/National Instruments/Circuit Design Suite*/", "**/National Instruments Downloads/", "Users/Public/Documents/PCB Artist/",
  "**/eclipse*/plugins/", "**/eclipse*/features/", "**/eclipse*/configuration/", "**/eclipse*/p2/",
  "**/jakarta-tomcat-*/", "**/apache-tomcat-*/", "**/webapps/examples/", "**/webapps/docs/", "**/Lib/site-packages/",
  "**/dsPIC33E_PIC24E_Bootloader_*/", "**/Office2k7/",
]
non_examples = ["Users/u1/Documents/Xilinx/adder/adder.docx", "Users/u1/Documents/MATLAB/fft.docx", "Users/u1/Documents/eclipse notes.docx", "Users/u1/Dropbox/school/webapps/report.docx"]
notes = "Matched by the install's folder structure, so a folder you named Xilinx or MATLAB yourself is still scanned"

[[exclusion]]
scope = "Developer tool settings, caches and repository internals"
os = "any"
patterns = ["**/.eclipse/", "**/.metadata/", "**/.netbeans/", "**/.explorer.cache/", "**/.explorer.local/", "**/.android/", "**/.hg/", "**/.dropbox/", "**/.dropbox.cache/", "**/Android/data/", "**/BlackBerry/app_world/"]
non_examples = ["Users/u1/Documents/android notes.docx", "Users/u1/Pictures/Android/photo.docx"]

[[exclusion]]
scope = "Software and games copied into user folders"
os = "any"
patterns = ["**/Age Of Empires*/", "**/Warcraft III*/", "**/kernel/linux-*/"]
non_examples = ["Users/u1/Documents/kernel notes.docx"]

# Rescued even though they sit under an excluded path. Only used if the matching
# file type is Include. Patterns must match the whole path.
[[exception]]
pattern = "Users/*/AppData/Local/Microsoft/Outlook/*.pst"

[[exception]]
pattern = "Documents and Settings/*/Local Settings/Application Data/Microsoft/Outlook/*.pst"

[[exception]]
pattern = "**/AppData/Local/Microsoft/Outlook/*.pst"

[junk]
names = ["Thumbs.db", "desktop.ini", ".DS_Store", "._*", "~$*", "~*.tmp", "_viminfo", ".viminfo"]
zero_byte = true
# Image size floor: 0 = off. Set e.g. 10240 to drop icons below 10 KB.
min_image_bytes = 0
image_extensions = ["jpg", "jpeg", "png", "gif", "bmp", "tif", "tiff", "heic", "heif", "webp"]

# Merging folder trees across drives. Each source path is stripped of the first matching
# prefix below, repeatedly, so these two map to the same place:
#   Users/joe/Documents/finance/w2.pdf  and  Backup 2012/finance/w2.pdf -> finance/w2.pdf
# Extra prefixes per drive can be given at intake (--strip-prefix). First match wins,
# so list the more specific patterns first. "*" matches one folder name.
[merge]
strip_prefixes = [
  "Users/*/Documents/",
  "Users/*/",
  "Documents and Settings/*/My Documents/",
  "Documents and Settings/*/",
  "My Documents/",
  "home/*/Documents/",
  "home/*/",
  "Backup/",
  "Backup [0-9][0-9][0-9][0-9]/",
]

# Camera-dump images go to Files/Photos/YYYY/MM/ by EXIF date, else oldest modified time.
[photos]
extensions = ["jpg", "jpeg", "png", "gif", "bmp", "tif", "tiff", "heic", "heif", "webp",
              "cr2", "cr3", "nef", "arw", "dng", "orf", "rw2", "raf", "pef", "srw"]
camera_folders = ["DCIM", "Camera Roll"]
camera_folder_regex = '^\d{3}[A-Za-z0-9_]{5}$'   # 100CANON, 100MEDIA, 101APPLE
