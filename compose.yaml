services:
  dev:
    build: { context: ., target: dev }
    volumes: [".:/app"]
    working_dir: /app
  # Same image, privileged: loop devices and mounts for the image-mock system tests.
  dev-root:
    build: { context: ., target: dev }
    volumes: [".:/app"]
    working_dir: /app
    privileged: true
